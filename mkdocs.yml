site_name: EspigaCloud
site_description: Documentación técnica, funcional, de calidad y auditoría SDLC de EspigaCloud
site_author: DulceCode
site_url: https://rouss07.github.io/EspigaCloud/
repo_url: https://github.com/Rouss07/EspigaCloud
repo_name: Rouss07/EspigaCloud
edit_uri: edit/main/docs/

theme:
  name: material
  language: es
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.action.edit
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: brown
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: brown
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  icon:
    repo: fontawesome/brands/github

nav:
  - Inicio: index.md
  - Cómo abrir MkDocs: como-abrir.md
  - Proyecto:
      - Visión general: proyecto.md
      - Arquitectura: arquitectura.md
  - Manual de usuario: manual-usuario.md
  - Auditoría SDLC: auditoria.md
  - Calidad:
      - Pruebas, cobertura y SonarQube: calidad.md
      - Informe de pruebas: INFORME_PRUEBAS_SISTEMA.md
      - Informe de seguridad: INFORME_SEGURIDAD.md
      - Informe de rendimiento: INFORME_RENDIMIENTO.md
      - Informe SonarQube: INFORME_SONARQUBE.md
  - CI/CD:
      - Jenkins y despliegue: cicd.md
      - Manual de configuración: MANUAL_CONFIGURACION_CICD.md
      - Pruebas k6: K6_PRUEBAS_RENDIMIENTO.md
  - Evidencias y descargas: evidencias.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true

plugins:
  - search:
      lang: es

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Rouss07/EspigaCloud
      name: Repositorio EspigaCloud
  generator: false

copyright: Documentación académica de EspigaCloud - Equipo DulceCode
