name: espigacloud-devops
services:
  jenkins:
    build: { context: ./jenkins }
    container_name: espigacloud-jenkins
    restart: unless-stopped
    group_add: ["0"]
    ports: ["8090:8080", "50000:50000"]
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc/jenkins.yaml
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-rosa}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?Configure JENKINS_ADMIN_PASSWORD en devops/.env}
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./jenkins/jenkins.yaml:/var/jenkins_home/casc/jenkins.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [devops]
    depends_on:
      sonarqube: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/login"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
  sonarqube:
    image: sonarqube:community
    container_name: espigacloud-sonarqube
    restart: unless-stopped
    ports: ["9000:9000"]
    environment: { SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true" }
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks: [devops]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': > /dev/tcp/127.0.0.1/9000'"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s
networks:
  devops: { name: espigacloud-devops, driver: bridge }
volumes:
  jenkins_home:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
