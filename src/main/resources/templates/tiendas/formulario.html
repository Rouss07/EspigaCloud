<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Formulario de Tienda</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bakery.css}">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container py-4">
    <h1 th:text="${tienda.id == null} ? 'Nueva Tienda' : 'Editar Tienda'"></h1>

    <form th:action="@{/tiendas/guardar}" th:object="${tienda}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}">
            <div th:each="error : ${#fields.allErrors()}" th:text="${error}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" th:field="*{nombre}" class="form-control" maxlength="100" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Dirección</label>
            <input type="text" th:field="*{direccion}" class="form-control" maxlength="180" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Teléfono</label>
            <input type="tel" th:field="*{telefono}" class="form-control" inputmode="numeric" pattern="[0-9]{7,15}" minlength="7" maxlength="15" required>
            <div class="text-danger" th:errors="*{telefono}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Estado</label>
            <select th:field="*{estado}" class="form-control" required>
                <option value="">Seleccione un estado</option>
                <option value="Activo">Activo</option>
                <option value="Inactivo">Inactivo</option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">Guardar</button>
        <a th:href="@{/tiendas}" class="btn btn-secondary">Volver</a>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
