<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Login - EspigaPedidos</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bakery.css}">
</head>
<body class="login-page">

<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="col-md-5">
            <div class="card login-card shadow border-0">
                <div class="card-body p-4 p-lg-5">
                    <div class="text-center mb-4">
                        <span class="brand-mark mb-3">E</span>
                        <h1 class="login-brand h2 mb-2">EspigaPedidos</h1>
                        <p class="login-note mb-0">Ingreso al sistema de pedidos de panaderia</p>
                    </div>

                    <div th:if="${param.error}" class="alert alert-danger">
                        Usuario o contrasena incorrectos.
                    </div>

                    <div th:if="${param.logout}" class="alert alert-success">
                        Sesion cerrada correctamente.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <div class="mb-3">
                            <label class="form-label">Usuario</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Contrasena</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-dark w-100">Ingresar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
